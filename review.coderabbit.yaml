# ---------------------------------------------------------------- #
# AI 기본 설정
# ---------------------------------------------------------------- #
language: ko-KR
tone_instructions: >
  당신은 시니어 백엔드 개발자입니다. 목표는 개발자가 코드 품질을 개선하며 성장하도록 돕는 것입니다.
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
  2. 리뷰는 교육적이어야 하며, 관련 개념이나 공식 문서를 함께 추천하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.
  4. 칭찬은 짧고 위트 있게 작성하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: false
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: true

  path_instructions:
    - path: "**/*.kt"
      instructions: |
        1. Kotlin 코드 컨벤션 및 Spring Boot 공식 스타일 가이드를 우선적으로 반영하세요.
        2. 다음 항목들을 중점적으로 검토해주세요:
           - 헥사고날 아키텍처 레이어 의존 방향 (presentation → business → implement → dataaccess)
           - 레이어 간 역참조 여부
           - 서비스 간 참조 여부 (같은 레이어끼리 참조 금지)
           - @Transactional 적절한 사용 (readOnly 여부)
           - QueryDSL 사용 시 소프트딜리트 status = ACTIVE 조건 누락 여부
           - @JvmInline value class VO 패턴 적절한 사용
           - AppException + ErrorType 예외 처리 패턴
           - null 대신 빈문자열 사용 여부 (not null 정책)
           - import * 사용 지양
           - 네이밍 직관성
        3. 각 리뷰 포인트별로 문제점과 대안, 예시 코드를 제시해주세요.
        4. 미작성한 테스트 케이스가 있다면 어떤 테스트가 필요한지 제안해주세요.
        5. 꼭 필요한 부분에 집중해서 리뷰해주세요.

    - path: "**/entity/**"
      instructions: |
        1. BaseEntity 상속 여부 확인 (createdAt, modifiedAt, status, deletedAt)
        2. 소프트딜리트 정책 준수 여부 (entity.delete() 메서드 사용)
        3. @ManyToOne FK 대신 ID/Key 직접 저장 정책 준수 여부
        4. 컬럼 not null 정책 (null 대신 빈문자열)
        5. columnDefinition = "TEXT" 사용 시 length 속성 제거 여부
        6. id를 맨 마지막에 선언했는지 확인

    - path: "**/repository/**"
      instructions: |
        1. QueryDSL 사용 시 status = ACTIVE 조건 반드시 포함 여부
        2. CustomRepository 패턴 적절한 사용 여부
        3. JpaRepository 기본 메서드 남용 여부 (소프트딜리트 누락 가능성)

    - path: "**/domain/**"
      instructions: |
        1. 순수 비즈니스 객체인지 확인 (엔티티 참조 금지)
        2. VO 패턴 적절한 사용 여부 (@JvmInline value class)
        3. VO 검증 실패 시 AppException 사용 여부

    - path: "**/presentation/**"
      instructions: |
        1. @Valid 어노테이션 사용 여부
        2. @AuthMember 어노테이션 사용 여부
        3. ApiResponse 공통 응답 포맷 사용 여부
        4. DTO가 도메인/엔티티를 직접 참조하지 않는지 확인

    - path: "**/*Test*"
      instructions: |
        1. Kotest BehaviorSpec 스타일 준수 여부
        2. MockK 사용 여부
        3. Given/When/Then 구조 적절한 사용 여부
        4. 경계값, 예외 케이스 테스트 포함 여부

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    enabled: false
    auto_incremental_review: false

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  auto_reply: true

# ---------------------------------------------------------------- #
# 지식 기반 설정
# ---------------------------------------------------------------- #
knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local