spring:
  config:
    activate:
      on-profile: test

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    hikari:
      jdbc-url: jdbc:h2:mem:retripdb;DB_CLOSE_DELAY=-1
      username: sa
      password:

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create

  h2:
    console:
      enabled: true

  cloud:
    gcp:
      storage:
        bucket: bucket
        project-id: project

logging:
  level:
    com.vibetrip: debug

jwt:
  secret-key: dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdA==

app:
  cache:
    configs:
      appleKeys:
        ttl: 24h
        max-size: 10